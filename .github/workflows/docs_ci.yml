name: docs-ci
on:
  push:
    branches:
      - main
    paths-ignore:
        - 'README.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - run: pip install -r requirements_docs.txt
      - run: mkdocs gh-deploy --force